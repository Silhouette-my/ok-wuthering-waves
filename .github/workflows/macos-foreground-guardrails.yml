name: macOS Foreground Branch Guardrails

on:
  push:
    branches:
      - feature/macos-foreground-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-foreground-okww-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-game-contracts:
    name: No-game contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"

    env:
      PYTHONIOENCODING: UTF-8
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out OK-WW integration branch
        uses: actions/checkout@v4
        with:
          path: ok-wuthering-waves
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Check out exact compatible ok-script commit
        uses: actions/checkout@v4
        with:
          repository: Silhouette-my/ok-script
          ref: e5a9d77ccb2227f79fedbb5d1b060906691059e9
          path: ok-script
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ok-script/pyproject.toml
            ok-wuthering-waves/pyproject.toml

      - name: Install sibling editable projects
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          set -euo pipefail
          framework_sha="$(git -C ../ok-script rev-parse HEAD)"
          export OK_SCRIPT_BUILD_VERSION="2.0.7b1+macos.${framework_sha}"
          echo "OK-WW $(git rev-parse HEAD) against ok-script ${framework_sha}"
          python -m pip install --upgrade pip
          python -m pip install -e "../ok-script[default,ocr,qt,dev]" opencv-python pytest-subtests
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run platform and task capability contracts
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          python -m pytest -q tests/test_macos*.py

      - name: Run legacy task tests in isolated processes
        working-directory: ok-wuthering-waves
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/Test*.py; do
            python -m unittest "$test_file"
          done
