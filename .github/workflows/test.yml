name: Run Tests

on:
  push:
    branches:
      - feature/macos-foreground-mvp
  pull_request:
    types: [ opened, synchronize ]

permissions:
  contents: read

jobs:
  build:
    name: Build exe with launcher
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1
          persist-credentials: false

      # The integration branch imports platform contracts that are not in the
      # currently published ok-script release. Keep CI reproducible by using an
      # reviewed immutable sibling commit instead of a mutable branch URL.
      - name: Check out compatible ok-script
        uses: actions/checkout@v4
        with:
          repository: Silhouette-my/ok-script
          ref: 936d1644eee00d8469d34e1c3d4630b5795ffeb4
          path: .ci/ok-script
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set UTF-8 encoding
        run: |
          set PYTHONIOENCODING=utf-8
          set PYTHONLEGACYWINDOWSSTDIO=utf-8
          echo PYTHONIOENCODING=utf-8 >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e ".ci/ok-script"
          python -m pip check

      - name: Run tests
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          # Legacy application tests use unittest-style Test*.py files.
          # Pytest-style platform contract tests run in the dedicated
          # macOS foreground guardrail workflow with the sibling ok-script branch.
          Get-ChildItem -Path ".\tests" -File |
            Where-Object { $_.Name -cmatch '^Test.*\.py$' } |
            Sort-Object Name |
            ForEach-Object {
              Write-Host "Running tests in $($_.FullName)"
              try {
                  # Run the Python unittest command
                  python -m unittest $_.FullName

                  # Check if the previous command succeeded
                  if ($LASTEXITCODE -ne 0) {
                      throw "Tests failed in $($_.FullName)"
                  }
              } catch {
                  # Stop the loop and return the error
                  Write-Error $_
                  exit 1
              }
          }

  
